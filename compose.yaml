name: amazon-movie-etl

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.12"
  image: amazon-movie-airflow:3.3.2-python3.12
  env_file: .env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Keep the stage-0 stack within the available WSL memory instead of
    # creating one LocalExecutor worker per host CPU.
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
    # Airflow 3 task workers must reach the separate Execution API service.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_SIMPLE_AUTH_MANAGER_USERS:-admin:admin}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json.generated
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_app:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW_CONN_AMAZON_MOVIES_DB: postgresql://movie_app:${MOVIE_DB_PASSWORD}@postgres:5432/amazon_movies
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/project/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./src:/opt/airflow/project/src:ro
    - ./config:/opt/airflow/project/config:ro
    - ./data/snapshots:/opt/airflow/project/data/snapshots
    - ./data/raw:/opt/airflow/project/data/raw:ro
    - ./data/work:/opt/airflow/project/data/work
    - ${MOVIES_SOURCE_PATH}:/opt/airflow/data/movies.txt.gz:ro
    - postgres-data:/opt/airflow/postgres-volume:ro
    - D:/DockerDesktopData/DockerDesktopWSL/disk:/opt/airflow/docker-disk-host:ro
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-bookworm
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      MOVIE_DB_PASSWORD: ${MOVIE_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/opt/project/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: ["api-server"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    command: ["dag-processor"]

volumes:
  postgres-data:

